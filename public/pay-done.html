<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment received</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#F2F5F8;--card:#fff;--text:#0B1A2E;--muted:#7A8EA8;--g:#00C65E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1A2E;--card:#13263F;--text:#E8EEF5;--muted:#9AB0C8}}
:root[data-theme="dark"]{--bg:#0B1A2E;--card:#13263F;--text:#E8EEF5;--muted:#9AB0C8}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
.card{background:var(--card);border-radius:18px;padding:28px 22px;max-width:380px;text-align:center}
.tick{width:64px;height:64px;border-radius:50%;background:var(--g);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
p{color:var(--muted);line-height:1.6;margin:8px 0 0}
</style>
</head>
<body>
<div class="card"><div class="tick">✓</div><h2 style="margin:0">Payment received</h2><p>You can go back to FixMi. It updates on its own in a moment.</p></div>
</body>
</html>
