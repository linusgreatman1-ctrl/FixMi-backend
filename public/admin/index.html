<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FixMi Admin</title>
<style>
:root{--g:#00C65E;--navy:#0B1A2E;--muted:#7A8EA8;--line:#E4EAF0;--bg:#F2F5F8;--red:#DC2626;--card:#fff;--text:#0B1A2E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1A2E;--card:#13263F;--line:#22385A;--text:#E8EEF5;--muted:#9AB0C8}}
:root[data-theme="dark"]{--bg:#0B1A2E;--card:#13263F;--line:#22385A;--text:#E8EEF5;--muted:#9AB0C8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
header b{font-size:20px}header b span{color:var(--g)}
header small{opacity:.6;flex:1}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--text)}
textarea{min-height:60px;resize:vertical}
button{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}
.g{background:var(--g);color:#fff}.r{background:#FEE2E2;color:var(--red)}.n{background:var(--navy);color:#fff}.l{background:var(--bg);color:var(--text)}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;background:#FEF3C7;color:#92400E}
.tag.ok{background:#DCFCE7;color:#166534}
.side{border-left:3px solid var(--line);padding:6px 0 6px 12px;margin:10px 0}
.side img{max-width:160px;border-radius:8px;display:inline-block;margin:6px 6px 0 0}
.err{color:var(--red);font-size:13px;min-height:18px}
label{font-size:13px;font-weight:600;display:block;margin:10px 0 5px}
</style>
</head>
<body>
<header><b>Fix<span>Mi</span></b><small>Admin</small><button class="l" id="out" hidden onclick="signOut()">Sign out</button></header>
<main>
  <div id="login" class="card" hidden>
    <h3 style="margin-top:0">Admin sign in</h3>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="g" onclick="signIn()">Sign in</button>
  </div>
  <div id="app" hidden>
    <div class="row" style="margin-bottom:12px">
      <button class="n" onclick="tab('disputes')">Disputes</button><button class="n" onclick="tab('kyc')">IDs</button><button class="n" onclick="tab('safety')">Safety</button><button class="n" onclick="tab('announce')">Announcements</button><button class="n" onclick="tab('audit')">Audit log</button>
    </div>
    <div id="sub" class="row" style="margin-bottom:12px"></div>
    <div id="list"></div>
  </div>
</main>
<script>
var tok = null; try { tok = sessionStorage.getItem('fixmi_admin'); } catch (e) {}
function naira(k){ return '₦' + Math.round((k||0)/100).toLocaleString('en-NG'); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function api(path, body, method){
  return fetch('/api' + path, { method: method || (body ? 'POST' : 'GET'), headers: Object.assign({ 'Content-Type': 'application/json' }, tok ? { Authorization: 'Bearer ' + tok } : {}), body: body ? JSON.stringify(body) : undefined })
    .then(function(r){ return r.json().then(function(d){ if (!r.ok) throw new Error(d.error || 'Request failed'); return d; }); });
}
function show(){ document.getElementById('login').hidden = !!tok; document.getElementById('app').hidden = !tok; document.getElementById('out').hidden = !tok; if (tok) tab('disputes'); }
function signIn(){
  var e = document.getElementById('lerr'); e.textContent = '';
  api('/auth/login', { email: document.getElementById('em').value.trim().toLowerCase(), password: document.getElementById('pw').value })
    .then(function(d){ if (d.user.role !== 'ADMIN') throw new Error('This account is not an admin.'); tok = d.accessToken; try { sessionStorage.setItem('fixmi_admin', tok); } catch (x) {} show(); })
    .catch(function(err){ e.textContent = err.message; });
}
function signOut(){ tok = null; try { sessionStorage.removeItem('fixmi_admin'); } catch (x) {} show(); }
var openOnly = true;
function load(open){
  openOnly = open;
  var list = document.getElementById('list'); list.innerHTML = '<div class="muted">Loading…</div>';
  api('/admin/disputes' + (open ? '' : '?open=false')).then(function(d){
    if (!d.disputes.length) { list.innerHTML = '<div class="card muted">No ' + (open ? 'open ' : '') + 'disputes.</div>'; return; }
    list.innerHTML = d.disputes.map(card).join('');
  }).catch(function(err){ if (/token|auth/i.test(err.message)) signOut(); list.innerHTML = '<div class="card err">' + esc(err.message) + '</div>'; });
}
function photos(urls, who){
  return String(urls || '').split('\n').filter(Boolean).map(function(u){ return '<a href="' + esc(u) + '" target="_blank" rel="noopener"><img src="' + esc(u) + '" alt="' + who + ' evidence"></a>'; }).join('');
}
function card(t){
  var b = t.booking || {};
  var held = (b.escrowHolds || []).filter(function(h){ return h.status === 'DISPUTED'; }).reduce(function(n,h){ return n + h.amountKobo; }, 0);
  var art = b.artisan ? b.artisan.user.name + ' (' + esc(b.artisan.user.phone || '') + ')' : '—';
  var h = '<div class="card"><div class="row" style="justify-content:space-between"><b>' + esc(t.subject) + '</b>' +
    (t.resolvedAt ? '<span class="tag ok">Resolved · ' + esc(t.resolution) + '</span>' : '<span class="tag">' + naira(held) + ' held</span>') + '</div>' +
    '<div class="muted">' + new Date(t.createdAt).toLocaleString() + ' · Agreed price ' + naira(b.agreedPriceKobo) + '</div>' +
    '<div class="side"><b>Customer — ' + esc(t.user.name) + ' (' + esc(t.user.phone || t.user.email || '') + ')</b><div>' + esc(t.message) + '</div>' +
    (t.requestedRefundKobo ? '<div class="muted">Asks for ' + naira(t.requestedRefundKobo) + ' back</div>' : '') +
    photos(t.evidenceUrl, 'Customer') + '</div>' +
    '<div class="side"><b>Artisan — ' + esc(art) + '</b><div>' + (t.secondPartyResponse ? esc(t.secondPartyResponse) : '<span class="muted">No response yet</span>') + '</div>' +
    photos(t.secondPartyEvidenceUrl, 'Artisan') + '</div>' +
    '<div class="muted">Job: ' + esc(b.category) + ' — ' + esc(b.issue) + '</div>';
  if (!t.resolvedAt) {
    h += '<label>Note to both sides (optional)</label><textarea id="note-' + t.id + '"></textarea>' +
      '<label>Refund to customer for a split (₦)</label><input id="amt-' + t.id + '" type="number" min="1" placeholder="e.g. ' + Math.round(held/200) + '">' +
      '<div class="err" id="err-' + t.id + '"></div>' +
      '<div class="row"><button class="g" onclick="resolve(\'' + t.id + '\',\'RELEASE\')">Pay artisan</button>' +
      '<button class="r" onclick="resolve(\'' + t.id + '\',\'REFUND\')">Refund customer</button>' +
      '<button class="n" onclick="resolve(\'' + t.id + '\',\'SPLIT\')">Split</button></div>';
  }
  return h + '</div>';
}
function resolve(id, outcome){
  var body = { outcome: outcome, note: document.getElementById('note-' + id).value };
  if (outcome === 'SPLIT') body.refundKobo = Math.round(Number(document.getElementById('amt-' + id).value) * 100);
  if (!confirm(outcome === 'RELEASE' ? 'Pay the artisan?' : outcome === 'REFUND' ? 'Refund the customer in full?' : 'Split as entered?')) return;
  api('/admin/disputes/' + id + '/resolve', body).then(function(){ load(openOnly); })
    .catch(function(err){ document.getElementById('err-' + id).textContent = err.message; });
}

function setList(h){ document.getElementById('list').innerHTML = h; }
function fail(err){ if (/token|auth/i.test(err.message)) signOut(); setList('<div class="card err">' + esc(err.message) + '</div>'); }
function tab(name){
  var sub = document.getElementById('sub'); sub.innerHTML = '';
  setList('<div class="muted">Loading…</div>');
  if (name === 'disputes') { sub.innerHTML = '<button class="l" onclick="load(true)">Open disputes</button><button class="l" onclick="load(false)">All disputes</button>'; load(true); }
  else if (name === 'kyc') loadKyc();
  else if (name === 'safety') loadSafety();
  else if (name === 'announce') loadAnnounce();
  else if (name === 'audit') loadAudit();
}
function when(d){ return new Date(d).toLocaleString(); }

function loadKyc(){
  api('/admin/kyc/documents?status=PENDING').then(function(d){
    if (!d.documents.length) return setList('<div class="card muted">No IDs waiting for review.</div>');
    setList(d.documents.map(function(x){
      return '<div class="card"><b>' + esc(x.user.name) + '</b> <span class="muted">' + esc(x.user.role) + ' · ' + esc(x.user.phone || x.user.email || '') + '</span>' +
        '<div class="muted">' + esc(x.docType.replace(/_/g,' ').toLowerCase()) + (x.idType ? ' · ' + esc(x.idType.replace(/_/g,' ')) + ' ' + esc(x.idNumber || '') : '') + ' · ' + when(x.createdAt) + '</div>' +
        '<div><img data-src="' + esc(x.fileUrl) + '" alt="ID" style="max-width:260px;border-radius:8px;margin:8px 0;cursor:zoom-in" onclick="window.open(this.src)"></div>' +
        '<label>Reason (needed to decline)</label><input id="kr-' + x.id + '"><div class="err" id="ke-' + x.id + '"></div>' +
        '<div class="row"><button class="g" onclick="reviewKyc(\'' + x.id + '\',\'APPROVED\')">Approve</button><button class="r" onclick="reviewKyc(\'' + x.id + '\',\'REJECTED\')">Decline</button></div></div>';
    }).join(''));
    loadImages();
  }).catch(fail);
}
function loadImages(){
  document.querySelectorAll('img[data-src]').forEach(function(img){
    fetch(img.getAttribute('data-src'), { headers: { Authorization: 'Bearer ' + tok } }).then(function(r){ if (!r.ok) throw 0; return r.blob(); })
      .then(function(b){ img.src = URL.createObjectURL(b); }).catch(function(){ img.alt = 'Could not load image'; });
  });
}
function reviewKyc(id, decision){
  api('/admin/kyc/documents/' + id + '/review', { decision: decision, reason: document.getElementById('kr-' + id).value }).then(loadKyc)
    .catch(function(err){ document.getElementById('ke-' + id).textContent = err.message; });
}

function loadSafety(){
  api('/admin/safety/reports').then(function(d){
    if (!d.reports.length) return setList('<div class="card muted">No safety reports.</div>');
    var order = { OPEN: 0, REVIEWING: 1, RESOLVED: 2 };
    d.reports.sort(function(a,b){ return (order[a.status]-order[b.status]) || ((a.type==='SOS'?0:1)-(b.type==='SOS'?0:1)) || (new Date(b.createdAt)-new Date(a.createdAt)); });
    setList(d.reports.map(function(x){
      var map = x.lat != null ? ' · <a href="https://www.google.com/maps/search/?api=1&query=' + x.lat + ',' + x.lng + '" target="_blank" rel="noopener">map</a>' : '';
      return '<div class="card"><div class="row" style="justify-content:space-between"><b>' + (x.type === 'SOS' ? '🚨 SOS' : esc(x.type.replace(/_/g,' '))) + ' — ' + esc(x.reporter.name) + '</b><span class="tag' + (x.status === 'RESOLVED' ? ' ok' : '') + '">' + x.status + '</span></div>' +
        '<div class="muted">' + esc(x.reporter.phone || '') + ' · ' + when(x.createdAt) + map + (x.bookingId ? ' · job ' + esc(x.bookingId.slice(0,8)) : '') + '</div>' +
        (x.description ? '<div class="side">' + esc(x.description) + '</div>' : '') +
        '<label>Note</label><textarea id="sn-' + x.id + '">' + esc(x.adminNote || '') + '</textarea><div class="err" id="se-' + x.id + '"></div>' +
        '<div class="row"><button class="n" onclick="setReport(\'' + x.id + '\',\'REVIEWING\')">Reviewing</button><button class="g" onclick="setReport(\'' + x.id + '\',\'RESOLVED\')">Resolve</button></div></div>';
    }).join(''));
  }).catch(fail);
}
function setReport(id, status){
  api('/admin/safety/reports/' + id, { status: status, adminNote: document.getElementById('sn-' + id).value }, 'PATCH').then(loadSafety)
    .catch(function(err){ document.getElementById('se-' + id).textContent = err.message; });
}

function loadAnnounce(){
  api('/admin/announcements').then(function(d){
    setList('<div class="card"><h3 style="margin-top:0">New announcement</h3><div class="muted">Super admin only. Sent as an in-app notification.</div>' +
      '<label>Title</label><input id="an-t" maxlength="120"><label>Message</label><textarea id="an-b" maxlength="1000"></textarea>' +
      '<label>Send to</label><select id="an-r"><option value="">Everyone</option><option value="CUSTOMER">Customers</option><option value="ARTISAN">Artisans</option></select>' +
      '<div class="err" id="an-e"></div><button class="g" onclick="sendAnnounce()">Send</button></div>' +
      d.announcements.map(function(a){ return '<div class="card"><b>' + esc(a.title) + '</b><div>' + esc(a.body) + '</div><div class="muted">' + when(a.createdAt) + ' · ' + a.recipientCount + ' people · ' + esc(a.sentByName) + '</div></div>'; }).join(''));
  }).catch(fail);
}
function sendAnnounce(){
  var r = document.getElementById('an-r').value;
  if (!confirm('Send this to ' + (r ? r.toLowerCase() + 's' : 'everyone') + '?')) return;
  api('/admin/announcements', { title: document.getElementById('an-t').value, body: document.getElementById('an-b').value, roles: r ? [r] : [] }).then(loadAnnounce)
    .catch(function(err){ document.getElementById('an-e').textContent = err.message; });
}

function loadAudit(){
  api('/admin/audit-log').then(function(d){
    if (!d.logs.length) return setList('<div class="card muted">Nothing logged yet.</div>');
    setList('<div class="card">' + d.logs.map(function(l){
      return '<div class="side"><b>' + esc(l.action) + '</b> <span class="muted">' + esc(l.actorName) + ' · ' + when(l.createdAt) + '</span>' + (l.details ? '<div class="muted">' + esc(l.details) + '</div>' : '') + '</div>';
    }).join('') + '</div>');
  }).catch(fail);
}
show();
</script>
</body>
</html>
