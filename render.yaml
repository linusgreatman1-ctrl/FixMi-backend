services:
  - type: web
    name: fixmi-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fixmi-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ESCROW_AUTO_RELEASE_HOURS
        value: "24"
      - key: PLATFORM_COMMISSION_PERCENT
        value: "10"
      # DEV ONLY — every "pay by wallet" step succeeds regardless of balance,
      # so the app can be clicked through end-to-end without real Paystack
      # funds. Set to "false" once this is a real product with real money.
      - key: DEV_BYPASS_PAYMENTS
        value: "true"
      # Left blank on purpose — fill in from the Paystack dashboard
      # (dashboard.paystack.com/#/settings/developers) after the first
      # deploy. Test keys are fine to start with.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      # Same-origin by default (the web app at /app calls this API on the
      # same domain, and mobile/desktop shells aren't browsers so CORS
      # doesn't apply to them) — only needed if you host a frontend on a
      # different domain later.
      - key: CORS_ORIGINS
        value: ""

databases:
  - name: fixmi-db
    plan: free
